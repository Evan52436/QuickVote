<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Quick Vote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --blue: #1e40ff; --red: #ff2e2e; --ink: #05070f; --paper: #f5f5f0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--ink);
    user-select: none;
  }

  /* ---------- VOTE SCREEN ---------- */
  #vote-view { position: fixed; inset: 0; display: flex; flex-direction: row; }
  @media (max-width: 700px) { #vote-view { flex-direction: column; } }
  .half {
    flex: 1; display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative;
    transition: filter 0.08s ease, transform 0.08s ease;
  }
  .half:active { filter: brightness(1.25); transform: scale(0.98); }
  .half.yes { background: var(--blue); }
  .half.no { background: var(--red); }
  .half .label {
    font-size: 18vw; font-weight: 900; letter-spacing: -0.03em;
    color: white; line-height: 1; pointer-events: none;
  }
  @media (min-width: 701px) { .half .label { font-size: 9vw; } }
  #toast {
    position: fixed; top: 24px; left: 50%;
    transform: translateX(-50%) translateY(-140%);
    background: var(--ink); color: white; padding: 12px 22px;
    border-radius: 999px; font-size: 15px; font-weight: 700;
    letter-spacing: 0.02em; z-index: 50;
    transition: transform 0.25s cubic-bezier(.2,.9,.3,1.3);
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  #voter-badge {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    z-index: 40; font-size: 12px; letter-spacing: 0.04em;
    color: rgba(255,255,255,0.65); font-family: 'Space Grotesk', sans-serif;
    display: none;
  }
  #voter-badge.show { display: block; }
  #voter-badge strong { color: white; }
  #voter-badge a { color: rgba(255,255,255,0.8); text-decoration: underline; margin-left: 6px; cursor: pointer; }

  /* ---------- NAME GATE ---------- */
  #name-gate {
    position: fixed; inset: 0; z-index: 100;
    background: var(--ink);
    display: flex; align-items: center; justify-content: center;
    opacity: 1; transition: opacity 0.25s ease;
  }
  #name-gate.hidden { opacity: 0; pointer-events: none; }
  .gate-card {
    width: min(90vw, 420px);
    text-align: center;
    font-family: 'Space Grotesk', sans-serif;
  }
  .gate-eyebrow {
    color: rgba(245,245,240,0.5);
    font-size: 12px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .gate-title {
    color: var(--paper);
    font-size: clamp(24px, 6vw, 34px);
    font-weight: 700;
    margin-bottom: 26px;
    line-height: 1.2;
  }
  #name-input {
    width: 100%;
    font-family: inherit;
    font-size: 18px;
    font-weight: 600;
    padding: 14px 18px;
    border-radius: 12px;
    border: 2px solid rgba(245,245,240,0.25);
    background: rgba(245,245,240,0.06);
    color: var(--paper);
    outline: none;
    text-align: center;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  #name-input:focus { border-color: var(--paper); }
  #name-input.shake { animation: shake 0.35s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  #name-continue {
    margin-top: 16px;
    width: 100%;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    padding: 14px 18px;
    border-radius: 12px;
    border: none;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.1s ease;
  }
  #name-continue:active { transform: scale(0.98); }
  .gate-note {
    margin-top: 18px;
    font-size: 12px;
    color: rgba(245,245,240,0.4);
    line-height: 1.5;
  }
</style>
</head>
<body>

  <div id="vote-view">
    <div class="half yes" id="btn-yes"><div class="label">YES</div></div>
    <div class="half no" id="btn-no"><div class="label">NO</div></div>
    <div id="toast">Vote counted</div>
    <div id="voter-badge">Voting as <strong id="voter-name"></strong><a id="change-name">change</a></div>
  </div>

  <div id="name-gate">
    <div class="gate-card">
      <div class="gate-eyebrow">Before you vote</div>
      <div class="gate-title">What's your name?</div>
      <input id="name-input" maxlength="40" placeholder="Type your name" autocomplete="off" />
      <button id="name-continue">Continue</button>
      <div class="gate-note">Your name shows up on the results screen next to your vote.</div>
    </div>
  </div>

<script>
  const NAME_KEY = 'quickvote_name';
  const toast = document.getElementById('toast');
  const gate = document.getElementById('name-gate');
  const input = document.getElementById('name-input');
  const continueBtn = document.getElementById('name-continue');
  const badge = document.getElementById('voter-badge');
  const voterNameEl = document.getElementById('voter-name');
  const changeNameLink = document.getElementById('change-name');
  let busy = false;

  function getSavedName() {
    return (localStorage.getItem(NAME_KEY) || '').trim();
  }

  function updateBadge(name) {
    voterNameEl.textContent = name;
    badge.classList.add('show');
  }

  function showGate() {
    gate.classList.remove('hidden');
    input.value = getSavedName();
    setTimeout(() => input.focus(), 60);
  }

  function hideGate() {
    gate.classList.add('hidden');
  }

  function submitName() {
    const name = input.value.trim().slice(0, 40);
    if (!name) {
      input.classList.remove('shake');
      void input.offsetWidth; // restart animation
      input.classList.add('shake');
      input.focus();
      return;
    }
    localStorage.setItem(NAME_KEY, name);
    updateBadge(name);
    hideGate();
  }

  continueBtn.addEventListener('click', submitName);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitName(); });
  changeNameLink.addEventListener('click', () => {
    localStorage.removeItem(NAME_KEY);
    input.value = '';
    showGate();
  });

  const existingName = getSavedName();
  if (existingName) {
    updateBadge(existingName);
    hideGate();
  } else {
    showGate();
  }

  async function castVote(choice) {
    if (busy) return;
    const name = getSavedName();
    if (!name) { showGate(); return; }

    busy = true;
    try {
      const res = await fetch('/api/vote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ choice, name }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || body.error || ('HTTP ' + res.status));
      }
      toast.textContent = choice === 'yes' ? 'Voted YES' : 'Voted NO';
    } catch (e) {
      toast.textContent = 'Vote failed: ' + e.message;
    }
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 900);
    busy = false;
  }

  document.getElementById('btn-yes').addEventListener('click', () => castVote('yes'));
  document.getElementById('btn-no').addEventListener('click', () => castVote('no'));
</script>
</body>
</html>
