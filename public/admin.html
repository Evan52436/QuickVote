<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vote — Live Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1e40ff;
    --red: #ff2e2e;
    --ink: #05070f;
    --paper: #f5f5f0;
    --live: #ffd60a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%; overflow: hidden;
    background: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
  }

  /* ---- full-bleed scoreboard bar ---- */
  #stage {
    position: fixed; inset: 0;
    display: flex;
    flex-direction: row;
  }
  .side {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    transition: width 0.6s cubic-bezier(.22,.9,.25,1);
  }
  .side.yes { background: var(--blue); }
  .side.no { background: var(--red); }

  .side .pct {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(60px, 14vw, 220px);
    color: white;
    line-height: 1;
    letter-spacing: -0.02em;
    text-align: center;
  }
  .side .pct .unit { font-size: 0.4em; vertical-align: super; opacity: 0.8; }
  .side .caption {
    position: absolute;
    top: 6%;
    font-size: clamp(14px, 1.6vw, 22px);
    font-weight: 700;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.75);
    text-transform: uppercase;
  }
  .side .count {
    position: absolute;
    bottom: 8%;
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(16px, 2vw, 26px);
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.05em;
  }

  /* ---- the rope: divider that slides with the split ---- */
  #divider {
    position: fixed;
    top: 0; bottom: 0;
    width: 6px;
    left: 50%;
    background: var(--paper);
    box-shadow: 0 0 24px rgba(245,245,240,0.7);
    transform: translateX(-50%);
    transition: left 0.6s cubic-bezier(.22,.9,.25,1);
    z-index: 20;
    pointer-events: none;
  }

  /* ---- top bar: question + live tag ---- */
  #topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 22px 0 0;
    z-index: 30;
    pointer-events: none;
  }
  #live-tag {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(5,7,15,0.55);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(245,245,240,0.15);
    border-radius: 999px;
    padding: 7px 16px 7px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--paper);
    text-transform: uppercase;
  }
  #live-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--live);
    box-shadow: 0 0 10px var(--live);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.75); }
  }

  /* ---- total, bottom center ---- */
  #total-wrap {
    position: fixed;
    bottom: 4%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 30;
    pointer-events: none;
  }
  #total-wrap .n {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(20px, 2.4vw, 32px);
    font-weight: 600;
    color: var(--paper);
  }
  #total-wrap .l {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(245,245,240,0.55);
    margin-top: 2px;
  }

  /* ---- admin controls, tucked in a corner, low-emphasis until hovered ---- */
  #controls {
    position: fixed;
    top: 18px; right: 20px;
    z-index: 40;
    display: flex;
    gap: 8px;
  }
  #controls button {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid rgba(245,245,240,0.25);
    background: rgba(5,7,15,0.4);
    color: rgba(245,245,240,0.7);
    backdrop-filter: blur(6px);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  #controls button:hover {
    background: rgba(245,245,240,0.12);
    color: var(--paper);
    border-color: rgba(245,245,240,0.5);
  }
  #clear-btn:hover {
    background: var(--red);
    border-color: var(--red);
    color: white;
  }

  #empty-note {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    color: rgba(245,245,240,0.35);
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(14px, 1.6vw, 20px);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    pointer-events: none;
  }
</style>
</head>
<body>

  <div id="stage">
    <div class="side yes" id="side-yes" style="width:50%">
      <span class="caption">Yes</span>
      <div class="pct"><span id="pct-yes">50</span><span class="unit">%</span></div>
      <span class="count" id="count-yes">0 votes</span>
    </div>
    <div class="side no" id="side-no" style="width:50%">
      <span class="caption">No</span>
      <div class="pct"><span id="pct-no">50</span><span class="unit">%</span></div>
      <span class="count" id="count-no">0 votes</span>
    </div>
  </div>

  <div id="divider"></div>
  <div id="empty-note">Waiting for the first vote…</div>
  <div id="err-banner" style="display:none;position:fixed;top:0;left:0;right:0;background:#000;color:#ffd60a;font-family:'JetBrains Mono',monospace;font-size:13px;text-align:center;padding:6px;z-index:50;"></div>

  <div id="topbar">
    <div id="live-tag"><span id="live-dot"></span>Live</div>
  </div>

  <div id="total-wrap">
    <div class="n" id="total-n">0</div>
    <div class="l">Total votes</div>
  </div>

  <div id="controls">
    <button id="refresh-btn" title="Refresh now">Refresh</button>
    <button id="clear-btn" title="Clear all votes">Clear votes</button>
  </div>

<script>
  const POLL_MS = 2000;

  async function fetchVotes() {
    const res = await fetch('/api/vote');
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || body.error || ('HTTP ' + res.status));
    }
    return res.json();
  }

  function render(yes, no) {
    const total = yes + no;
    const yesPct = total ? Math.round((yes / total) * 100) : 50;
    const noPct = total ? 100 - yesPct : 50;

    document.getElementById('side-yes').style.width = yesPct + '%';
    document.getElementById('side-no').style.width = noPct + '%';
    document.getElementById('divider').style.left = yesPct + '%';

    document.getElementById('pct-yes').textContent = yesPct;
    document.getElementById('pct-no').textContent = noPct;
    document.getElementById('count-yes').textContent = yes.toLocaleString() + ' vote' + (yes === 1 ? '' : 's');
    document.getElementById('count-no').textContent = no.toLocaleString() + ' vote' + (no === 1 ? '' : 's');
    document.getElementById('total-n').textContent = total.toLocaleString();

    document.getElementById('empty-note').style.display = total === 0 ? 'flex' : 'none';
  }

  async function tick() {
    try {
      const { yes, no } = await fetchVotes();
      render(yes || 0, no || 0);
      document.getElementById('err-banner').style.display = 'none';
    } catch (e) {
      const banner = document.getElementById('err-banner');
      banner.textContent = 'Server error: ' + e.message;
      banner.style.display = 'block';
    }
  }

  document.getElementById('refresh-btn').addEventListener('click', tick);
  document.getElementById('clear-btn').addEventListener('click', async () => {
    if (!confirm('Clear all votes back to zero? This cannot be undone.')) return;
    await fetch('/api/reset', { method: 'POST' });
    tick();
  });

  tick();
  setInterval(tick, POLL_MS);
</script>
</body>
</html>
